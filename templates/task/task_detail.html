{% extends "../base.html" %}
{% block title %}
  <title>{{ object.title }}</title>
{% endblock title %}
{% block content %}
  <div class="container mt-3">
    <h1>{{ object.title }}</h1>
    <p>{{ object.desc }}</p>
    <p>
      Статус: <span class="badge badge-primary">{{ object.status }}</span>
    </p>
    <p>
      Пріоритет: <span class="badge badge-secondary">{{ object.priority }}</span>
    </p>
    <p>Дедлайн: {{ object.due_to|date }}</p>
    <a href="" class="btn btn-warning">Редагувати</a>
    <a href="" class="btn btn-danger">Видалити</a>
  </div>
{% endblock content %}
