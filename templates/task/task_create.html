{% extends "../base.html" %}
{% block title %}
  <title>Create Task</title>
{% endblock title %}
{% block content %}
  <div class="container mt-3">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="fieldWrapper row align-items-center mb-3">
          <label for="{{ field.id_for_label }}" class="col-sm-2 col-form-label">{{ field.label_tag }}</label>
          <div class="col-sm-10">{{ field }}</div>
        </div>
      {% endfor %}
      <input class="btn btn-success" type="submit" value="Зберегти">
    </form>
  </div>
{% endblock content %}
